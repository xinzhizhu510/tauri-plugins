name: Build and Publish to GitHub Packages

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@xinzhizhu510'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: |
          npx lerna run build --stream --scope='@xinzhizhu510/tauri-plugin-*' --ignore='@xinzhizhu510/tauri-plugin-example-app'
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Publish packages
        run: |
          npx lerna publish from-package --yes --no-verify-access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create and push tags
        run: |
          # Get list of packages and their versions
          for package_json in packages/*/package.json; do
            # Skip example-app as it's private
            if [[ "$package_json" == *"example-app"* ]]; then
              continue
            fi
            
            # Extract package name and version
            package_name=$(node -p "require('./$package_json').name")
            version=$(node -p "require('./$package_json').version")
            
            # Remove @xinzhizhu510/ scope from package name for tag
            tag_name="${package_name#@xinzhizhu510/}@${version}"
            
            # Check if tag already exists
            if git rev-parse "$tag_name" >/dev/null 2>&1; then
              echo "Tag $tag_name already exists, skipping..."
            else
              echo "Creating tag: $tag_name"
              git tag -a "$tag_name" -m "Release $package_name version $version"
            fi
          done
          
          # Push all tags
          echo "Pushing tags to remote..."
          git push --tags
