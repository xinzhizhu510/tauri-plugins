name: Build and Publish to GitHub Packages

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@xinzhizhu510'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: |
          npx lerna run build --stream --scope='@xinzhizhu510/tauri-plugin-*' --ignore='@xinzhizhu510/tauri-plugin-example-app'
      
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
      
      - name: Publish packages
        run: |
          npx lerna publish from-package --yes --no-verify-access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create and push tags
        run: |
          # Get list of packages and their versions
          tags_created=()
          
          for package_json in packages/*/package.json; do
            # Skip private packages by checking the private field
            # Handle undefined, null, and error cases by defaulting to false
            is_private=$(node -p "try { const pkg = require('./$package_json'); pkg.private === true ? 'true' : 'false' } catch(e) { 'false' }" 2>/dev/null || echo "false")
            if [[ "$is_private" == "true" ]]; then
              echo "Skipping private package: $package_json"
              continue
            fi
            
            # Extract package name and version with error handling
            package_name=$(node -p "require('./$package_json').name" 2>/dev/null)
            version=$(node -p "require('./$package_json').version" 2>/dev/null)
            
            if [[ -z "$package_name" ]] || [[ -z "$version" ]]; then
              echo "Warning: Failed to extract name or version from $package_json, skipping..."
              continue
            fi
            
            # Extract short name (remove scope if present)
            if [[ "$package_name" == @* ]]; then
              # Remove scope (everything before the last /)
              short_name="${package_name##*/}"
            else
              short_name="$package_name"
            fi
            
            tag_name="${short_name}@${version}"
            
            # Check if tag already exists
            if git rev-parse "$tag_name" >/dev/null 2>&1; then
              echo "Tag $tag_name already exists, skipping..."
            else
              echo "Creating tag: $tag_name"
              if git tag -a "$tag_name" -m "Release $package_name version $version"; then
                tags_created+=("$tag_name")
                echo "✓ Successfully created tag: $tag_name"
              else
                echo "✗ Failed to create tag: $tag_name"
              fi
            fi
          done
          
          # Push only newly created tags
          if [ ${#tags_created[@]} -gt 0 ]; then
            echo "Pushing newly created tags: ${tags_created[*]}"
            for tag in "${tags_created[@]}"; do
              if git push origin "$tag"; then
                echo "✓ Successfully pushed tag: $tag"
              else
                echo "✗ Failed to push tag: $tag"
              fi
            done
          else
            echo "No new tags to push"
          fi
